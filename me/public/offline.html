<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Jimmy Pro</title>
<meta name="theme-color" content="#04140d" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div style="max-width:420px;margin:0 auto;padding:80px 22px;text-align:center">
  <div class="brand-mark" style="margin:0 auto 18px;width:52px;height:52px;border-radius:15px">
    <svg viewBox="0 0 24 24" fill="none" style="width:26px;height:26px"><path d="M5 13.5l4.2 4.2L19 7.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1 style="font-size:22px;margin-bottom:10px">You're offline</h1>
  <p class="muted" style="font-size:14px;line-height:1.6;margin-bottom:22px">
    Jimmy Pro needs a connection to send payment prompts. Reconnect and try again — your saved records will still be here.
  </p>
  <button class="btn btn-primary btn-block" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
